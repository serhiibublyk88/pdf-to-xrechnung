name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
        working-directory: apps/api
      - run: npm run lint
      - run: npm run knip
      - run: npm run eval:validate

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
        working-directory: apps/api
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pdf_to_xrechnung
          POSTGRES_PASSWORD: pdf_to_xrechnung
          POSTGRES_DB: pdf_to_xrechnung
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pdf_to_xrechnung"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://pdf_to_xrechnung:pdf_to_xrechnung@localhost:5432/pdf_to_xrechnung
      REDIS_URL: redis://localhost:6379
      KOSIT_VALIDATOR_URL: http://localhost:8081
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t kosit-validator ./docker/kosit-validator
      - run: docker run -d --name kosit-validator -p 8081:8081 kosit-validator
      - name: Wait for the KoSIT validator
        run: |
          for _ in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' kosit-validator)" = healthy ] && exit 0
            sleep 5
          done
          docker logs kosit-validator
          exit 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
        working-directory: apps/api
      - run: npx prisma migrate deploy
        working-directory: apps/api
      - run: |
          sudo apt-get update
          sudo apt-get install -y \
            poppler-utils=24.02.0-1ubuntu9.9 \
            tesseract-ocr=5.3.4-1build5 \
            tesseract-ocr-deu=1:4.1.0-2
      - run: npm test
      - run: npm run test:integration
      - run: npm run test:e2e

  build:
    runs-on: ubuntu-latest
    env:
      API_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
        working-directory: apps/api
      - run: npm run build
      - run: test -f apps/api/dist/main.js
      - run: test -f apps/api/dist/extraction/pdf-text.worker.mjs

  docker-build:
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - run: |
          docker buildx build --load \
            --cache-from type=gha,scope=docker-api --cache-to type=gha,mode=max,scope=docker-api \
            -f apps/api/Dockerfile -t pdf-to-xrechnung-api .
      - run: |
          docker buildx build --load \
            --cache-from type=gha,scope=docker-web --cache-to type=gha,mode=max,scope=docker-web \
            --build-arg API_ORIGIN=http://api:3000 \
            -f apps/web/Dockerfile -t pdf-to-xrechnung-web .
      # Compose's development mode in the pruned production image still needs pino-pretty.
      - run: docker run --rm pdf-to-xrechnung-api node -e "require.resolve('pino-pretty')"
      - run: docker run --rm pdf-to-xrechnung-api sh -c '! find /repo/node_modules -type d \( -name prisma -o -name mysql2 -o -name deepmerge-ts \) -print -quit | grep -q .'
      - run: cp apps/api/.env.example .env
      - run: docker compose up -d --build --wait
      - name: Wait for the API to report ready (Postgres, Redis and KoSIT reachable)
        run: |
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:3001/health/ready && exit 0
            sleep 5
          done
          docker compose logs
          exit 1
      - run: curl -fsS http://localhost:3000/api/health/live
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run measure:bundle -w apps/web
        env:
          BUNDLE_BASE_URL: http://localhost:3000
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run test:e2e -w apps/web
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          PLAYWRIGHT_EXPECT_PRODUCTION: 'true'
          API_ORIGIN: http://localhost:3001
          DATABASE_URL: postgresql://pdf_to_xrechnung:pdf_to_xrechnung@localhost:5432/pdf_to_xrechnung
      - run: docker compose logs
        if: always()
      - run: docker compose down -v
        if: always()
