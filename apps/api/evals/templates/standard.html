<!doctype html>
<html lang="{{LANGUAGE}}">
  <head>
    <meta charset="utf-8" />
    <style>
      @page {
        size: A4;
        margin: 18mm;
      }
      * {
        box-sizing: border-box;
      }
      body {
        color: #172033;
        font:
          11px/1.45 Arial,
          sans-serif;
        margin: 0;
      }
      h1 {
        font-size: 25px;
        letter-spacing: 0.04em;
        margin: 0 0 24px;
      }
      h2 {
        font-size: 12px;
        margin: 0 0 5px;
      }
      header {
        align-items: start;
        border-bottom: 2px solid #264c73;
        display: flex;
        justify-content: space-between;
        margin-bottom: 22px;
        padding-bottom: 14px;
      }
      .parties {
        display: grid;
        gap: 20px;
        grid-template-columns: 1fr 1fr;
        margin: 20px 0;
      }
      .metadata {
        display: grid;
        gap: 5px 22px;
        grid-template-columns: max-content 1fr;
      }
      table {
        border-collapse: collapse;
        width: 100%;
      }
      th {
        background: #eaf0f5;
        text-align: left;
      }
      th,
      td {
        border-bottom: 1px solid #d5dce5;
        padding: 7px 6px;
        vertical-align: top;
      }
      .number {
        text-align: right;
        white-space: nowrap;
      }
      .totals {
        margin-left: auto;
        margin-top: 18px;
        width: 46%;
      }
      .totals td {
        border: 0;
        padding: 3px 0;
      }
      .gross td {
        border-top: 2px solid #264c73;
        font-size: 14px;
        font-weight: 700;
        padding-top: 7px;
      }
      .page-break {
        break-before: page;
      }
      .footer {
        color: #506277;
        font-size: 9px;
        margin-top: 28px;
      }
    </style>
  </head>
  <body>
    {{BODY}}
  </body>
</html>
